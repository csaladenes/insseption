# Snippet for the production compose file (host Traefik stack).
# The API reverse-proxies /agent/*; agent stays on the internal network.

  insseption-agent:
    build: ./insseption/agent
    image: covid19-romania_insseption-agent
    user: "0"
    container_name: insseption-agent
    hostname: insseption-agent
    restart: always
    env_file: ./insseption/.env
    volumes:
      - ./insseption/agent/src:/app/src:ro
      - ./insseption/agent/config:/app/config:ro
    environment:
      - INSSEPTION_API_URL=http://insseption:8787/api/v1
      - CATALOG_PATH=/app/config/catalog.json
      - LLM_MODEL=deepseek/deepseek-v4.1-flash
      - OPENROUTER_REFERRER=https://insse.csaladen.es
      - OPENROUTER_TITLE=insseption agent
    mem_limit: 384m
    cpus: 0.4
    labels:
      - traefik.enable=false
    networks:
      - internal
    depends_on:
      - insseption
