# Reference / local-only compose.
# Production is integrated into the host Traefik stack at insse.csaladen.es
# (service names: insseption, insseption-agent).
#
#   docker-compose up -d --build

version: "2.4"

services:
  insseption:
    build: .
    image: insseption:local
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      INSSEPTION_STATIC_DIR: /app/web
      OPENROUTER_MODEL: deepseek/deepseek-v4.1-flash
      INSSEPTION_AGENT_URL: http://insseption-agent:8000
    volumes:
      - ./web:/app/web:ro
    depends_on:
      - insseption-agent

  insseption-agent:
    build: ./agent
    image: insseption-agent:local
    env_file:
      - .env
    environment:
      INSSEPTION_API_URL: http://insseption:8787/api/v1
      LLM_MODEL: deepseek/deepseek-v4.1-flash
      CATALOG_PATH: /app/config/catalog.json
    volumes:
      - ./agent/src:/app/src:ro
      - ./agent/config:/app/config:ro
