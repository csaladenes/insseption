<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>insseption</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1 class="brand" id="brand">insseption</h1>
      <p class="tagline" id="tagline"></p>
      <p class="blurb" id="blurb"></p>
      <div class="toolbar">
        <div class="lang-switch" id="lang-switch" aria-label="UI language"></div>
        <label>
          <span id="data-lang-label">Data language</span>
          <select id="data-lang">
            <option value="ro">RO</option>
            <option value="en">EN</option>
          </select>
        </label>
      </div>
      <div class="search-row">
        <input id="search" type="search" autocomplete="off" />
        <button class="btn secondary" id="curl" type="button">Copy curl</button>
      </div>
      <ul class="hits panel" id="hits" hidden></ul>
      <p class="status" id="status"></p>
    </header>

    <div class="layout">
      <aside>
        <section class="panel">
          <h2 id="browse-title">Browse</h2>
          <ul class="tree" id="tree"></ul>
        </section>
        <section class="panel" style="margin-top:1rem">
          <h2 id="news-title">News</h2>
          <ul class="news" id="news"></ul>
        </section>
      </aside>

      <section class="panel" id="matrix" hidden>
        <div class="matrix-head">
          <h1 id="matrix-title"></h1>
          <div class="crumbs" id="crumbs"></div>
          <p class="def" id="definition"></p>
        </div>
        <h2 id="dims-title">Dimensions</h2>
        <div class="dims" id="dims"></div>
        <div class="actions">
          <button class="btn" id="run" type="button">Run</button>
          <button class="btn secondary" id="csv" type="button">CSV</button>
        </div>
        <h2 id="results-title">Results</h2>
        <div id="results"></div>
      </section>
    </div>

    <footer class="footer">
      <span id="attr"></span>
      <a id="terms" href="https://insse.ro/cms/ro/content/reutilizarea-statisticilor-sse" target="_blank" rel="noreferrer">Terms</a>
      <a id="docs" href="/docs" target="_blank" rel="noreferrer">API</a>
      <a id="github" href="https://github.com/csaladenes/insseption" target="_blank" rel="noreferrer">GitHub</a>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./chat.js"></script>
</body>
</html>
